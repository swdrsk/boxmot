# PreloadSORT固有パラメータ
match_threshold:
  type: uniform
  default: 0.45
  range: [0.3, 0.8]

enable_scene_change_detection:
  type: choice
  default: false
  options: [true, false]

scene_change_threshold:
  type: uniform
  default: 0.3
  range: [0.1, 0.5]

# BotSORTから継承するパラメータ
track_high_thresh:
  type: uniform
  default: 0.4
  range: [0.3, 0.7]

track_low_thresh:
  type: uniform
  default: 0.1
  range: [0.1, 0.3]

new_track_thresh:
  type: uniform
  default: 0.5
  range: [0.1, 0.8]

track_buffer:
  type: randint
  default: 60
  range: [20, 81]

match_thresh:
  type: uniform
  default: 0.7
  range: [0.1, 0.9]

proximity_thresh:
  type: uniform
  default: 0.5
  range: [0.25, 0.75]

appearance_thresh:
  type: uniform
  default: 0.25
  range: [0.1, 0.8]

cmc_method:
  type: choice
  default: ecc
  options: [sof, ecc]